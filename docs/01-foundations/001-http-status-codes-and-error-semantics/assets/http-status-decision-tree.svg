<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#0d1117; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Card glow filters -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="1" y="1" width="998" height="638" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Top Header Section -->
  <g transform="translate(40, 32)">
    <!-- Brand / Category Pill -->
    <rect x="0" y="0" width="310" height="24" rx="12" fill="#1e1e38" stroke="#6366f1" stroke-width="1.2"/>
    <text x="12" y="16" fill="#a5b4fc" font-size="11" font-weight="700" letter-spacing="1">WHAT BREAKS IN PROD • 01 FOUNDATIONS • 001</text>
    
    <!-- Title -->
    <text x="0" y="54" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="-0.5">Which HTTP Status Code Should You Return?</text>
    <text x="0" y="74" fill="#94a3b8" font-size="13">Follow the decision path before sending a response to keep monitoring, caches, and client apps resilient.</text>
  </g>

  <!-- COLUMN 1: SUCCESS (2xx) -->
  <g transform="translate(40, 130)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="290" height="420" rx="8" fill="#161b22" stroke="#10b981" stroke-width="1.5" filter="url(#card-shadow)"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="290" height="46" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="22" cy="23" r="8" fill="#10b981"/>
    <text x="18" y="27" fill="#064e3b" font-size="12" font-weight="900">✓</text>
    <text x="38" y="24" fill="#ecfdf5" font-size="14" font-weight="700">1. It Worked (2xx)</text>
    <text x="38" y="38" fill="#a7f3d0" font-size="10">Request completed successfully</text>

    <!-- Item 1 -->
    <g transform="translate(16, 62)">
      <text x="0" y="12" fill="#94a3b8" font-size="11">Created a brand new record?</text>
      <rect x="0" y="18" width="80" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="10" y="33" fill="#34d399" font-size="12" font-weight="800">201</text>
      <text x="40" y="33" fill="#a7f3d0" font-size="10" font-weight="600">Created</text>
      <text x="90" y="33" fill="#64748b" font-size="10">Saved new item in DB</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(16, 118)">
      <text x="0" y="12" fill="#94a3b8" font-size="11">Standard data response?</text>
      <rect x="0" y="18" width="80" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="10" y="33" fill="#34d399" font-size="12" font-weight="800">200</text>
      <text x="40" y="33" fill="#a7f3d0" font-size="10" font-weight="600">OK</text>
      <text x="90" y="33" fill="#64748b" font-size="10">Standard payload body</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(16, 174)">
      <text x="0" y="12" fill="#94a3b8" font-size="11">Success with no body (e.g. DELETE)?</text>
      <rect x="0" y="18" width="94" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="8" y="33" fill="#34d399" font-size="12" font-weight="800">204</text>
      <text x="36" y="33" fill="#a7f3d0" font-size="9.5" font-weight="600">No Content</text>
      <text x="104" y="33" fill="#64748b" font-size="10">Nothing to display</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(16, 230)">
      <text x="0" y="12" fill="#94a3b8" font-size="11">Cached file has not changed?</text>
      <rect x="0" y="18" width="94" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="8" y="33" fill="#94a3b8" font-size="12" font-weight="800">304</text>
      <text x="36" y="33" fill="#cbd5e1" font-size="9" font-weight="600">Not Modified</text>
      <text x="104" y="33" fill="#64748b" font-size="10">Client uses cache</text>
    </g>

    <!-- Bottom summary box -->
    <rect x="14" y="310" width="262" height="92" rx="6" fill="#0f291e" stroke="#059669" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="24" y="330" fill="#34d399" font-size="11" font-weight="700">CLIENT BEHAVIOR:</text>
    <text x="24" y="348" fill="#e2e8f0" font-size="11">Parses payload data successfully.</text>
    <text x="24" y="364" fill="#e2e8f0" font-size="11">Observability logs positive health.</text>
    <text x="24" y="380" fill="#a7f3d0" font-size="10.5">Automated retries are NOT triggered.</text>
  </g>

  <!-- COLUMN 2: CLIENT ERROR (4xx) -->
  <g transform="translate(355, 130)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="290" height="420" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow)"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="290" height="46" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="22" cy="23" r="8" fill="#f59e0b"/>
    <text x="19" y="27" fill="#451a03" font-size="12" font-weight="900">!</text>
    <text x="38" y="24" fill="#fffbeb" font-size="14" font-weight="700">2. Client Mistake (4xx)</text>
    <text x="38" y="38" fill="#fde68a" font-size="10">Fix input • Do NOT retry unchanged</text>

    <!-- Item 1 -->
    <g transform="translate(14, 58)">
      <rect x="0" y="4" width="76" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="8" y="18" fill="#fbbf24" font-size="11.5" font-weight="800">401</text>
      <text x="36" y="18" fill="#fde68a" font-size="9" font-weight="600">Unauth</text>
      <text x="84" y="18" fill="#e2e8f0" font-size="10.5">Who are you? (Please log in)</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(14, 94)">
      <rect x="0" y="4" width="76" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="8" y="18" fill="#fbbf24" font-size="11.5" font-weight="800">403</text>
      <text x="34" y="18" fill="#fde68a" font-size="9" font-weight="600">Forbidden</text>
      <text x="84" y="18" fill="#e2e8f0" font-size="10.5">Logged in, but no permission</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(14, 130)">
      <rect x="0" y="4" width="76" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="8" y="18" fill="#fbbf24" font-size="11.5" font-weight="800">404</text>
      <text x="34" y="18" fill="#fde68a" font-size="9" font-weight="600">Not Found</text>
      <text x="84" y="18" fill="#e2e8f0" font-size="10.5">Resource does not exist</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(14, 166)">
      <rect x="0" y="4" width="76" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="8" y="18" fill="#fbbf24" font-size="11.5" font-weight="800">409</text>
      <text x="36" y="18" fill="#fde68a" font-size="9" font-weight="600">Conflict</text>
      <text x="84" y="18" fill="#e2e8f0" font-size="10.5">Duplicate item / email taken</text>
    </g>

    <!-- Item 5 -->
    <g transform="translate(14, 202)">
      <rect x="0" y="4" width="76" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="8" y="18" fill="#fbbf24" font-size="11.5" font-weight="800">422</text>
      <text x="34" y="18" fill="#fde68a" font-size="9" font-weight="600">Invalid</text>
      <text x="84" y="18" fill="#e2e8f0" font-size="10.5">Syntax okay, business values bad</text>
    </g>

    <!-- Item 6 -->
    <g transform="translate(14, 238)">
      <rect x="0" y="4" width="76" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="8" y="18" fill="#fbbf24" font-size="11.5" font-weight="800">429</text>
      <text x="34" y="18" fill="#fde68a" font-size="9" font-weight="600">Rate Limit</text>
      <text x="84" y="18" fill="#e2e8f0" font-size="10.5">Too fast. Read Retry-After</text>
    </g>

    <!-- Bottom summary box -->
    <rect x="14" y="310" width="262" height="92" rx="6" fill="#291804" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="24" y="330" fill="#fbbf24" font-size="11" font-weight="700">CLIENT BEHAVIOR:</text>
    <text x="24" y="348" fill="#e2e8f0" font-size="11">Display validation error to user.</text>
    <text x="24" y="364" fill="#fde68a" font-size="10.5">NEVER automatically retry 4xx.</text>
    <text x="24" y="380" fill="#94a3b8" font-size="10">Retrying bad data wastes bandwidth.</text>
  </g>

  <!-- COLUMN 3: SERVER ERROR (5xx) -->
  <g transform="translate(670, 130)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="290" height="420" rx="8" fill="#161b22" stroke="#f43f5e" stroke-width="1.5" filter="url(#card-shadow)"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="290" height="46" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="22" cy="23" r="8" fill="#f43f5e"/>
    <text x="18" y="27" fill="#4c0519" font-size="12" font-weight="900">✕</text>
    <text x="38" y="24" fill="#fff1f2" font-size="14" font-weight="700">3. Server Crashed (5xx)</text>
    <text x="38" y="38" fill="#fecdd3" font-size="10">System failure • Safe to retry with delay</text>

    <!-- Item 1 -->
    <g transform="translate(14, 62)">
      <rect x="0" y="4" width="78" height="20" rx="4" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
      <text x="8" y="18" fill="#fda4af" font-size="11.5" font-weight="800">500</text>
      <text x="34" y="18" fill="#fecdd3" font-size="9" font-weight="600">Crash</text>
      <text x="88" y="18" fill="#e2e8f0" font-size="10.5">Unhandled bug in our code</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(14, 114)">
      <rect x="0" y="4" width="78" height="20" rx="4" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
      <text x="8" y="18" fill="#fda4af" font-size="11.5" font-weight="800">502</text>
      <text x="34" y="18" fill="#fecdd3" font-size="8.5" font-weight="600">Bad Gateway</text>
      <text x="88" y="18" fill="#e2e8f0" font-size="10.5">Upstream dependency died</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(14, 166)">
      <rect x="0" y="4" width="78" height="20" rx="4" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
      <text x="8" y="18" fill="#fda4af" font-size="11.5" font-weight="800">503</text>
      <text x="34" y="18" fill="#fecdd3" font-size="8.5" font-weight="600">Unavailable</text>
      <text x="88" y="18" fill="#e2e8f0" font-size="10.5">Overloaded or maintenance</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(14, 218)">
      <rect x="0" y="4" width="78" height="20" rx="4" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
      <text x="8" y="18" fill="#fda4af" font-size="11.5" font-weight="800">504</text>
      <text x="34" y="18" fill="#fecdd3" font-size="9" font-weight="600">Timeout</text>
      <text x="88" y="18" fill="#e2e8f0" font-size="10.5">Upstream took too long</text>
    </g>

    <!-- Bottom summary box -->
    <rect x="14" y="310" width="262" height="92" rx="6" fill="#2c0b14" stroke="#e11d48" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="24" y="330" fill="#fda4af" font-size="11" font-weight="700">CLIENT BEHAVIOR:</text>
    <text x="24" y="348" fill="#e2e8f0" font-size="11">Notify user of temporary issue.</text>
    <text x="24" y="364" fill="#fecdd3" font-size="10.5">Retry with Exponential Backoff.</text>
    <text x="24" y="380" fill="#94a3b8" font-size="10">Alerts fire; SRE teams get paged.</text>
  </g>

  <!-- Bottom Golden Rule Banner -->
  <g transform="translate(40, 568)">
    <rect x="0" y="0" width="920" height="42" rx="6" fill="#1e1e38" stroke="#6366f1" stroke-width="1.2"/>
    <text x="24" y="26" fill="#a5b4fc" font-size="12" font-weight="800">GOLDEN RULE:</text>
    <text x="122" y="26" fill="#f8fafc" font-size="12">Never return 200 OK for an error. It blinds monitoring, breaks retries, and pollutes caches.</text>
  </g>
</svg>
