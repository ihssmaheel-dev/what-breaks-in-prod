<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="header-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="card-shadow-2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1040" height="700" rx="12" fill="url(#bg2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="280" height="22" rx="11" fill="#1e1e38" stroke="#6366f1" stroke-width="1"/>
    <text x="12" y="15" fill="#a5b4fc" font-size="10.5" font-weight="700" letter-spacing="1">WHAT BREAKS IN PROD • 01 FOUNDATIONS</text>
    <text x="0" y="52" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="-0.5">The Production HTTP Status Code Decision Flow</text>
    <text x="0" y="72" fill="#94a3b8" font-size="13">Ask these 3 questions in order before returning any response to client applications.</text>
  </g>

  <!-- START NODE -->
  <g transform="translate(40, 125)">
    <rect x="0" y="0" width="960" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="480" y="23" fill="#f8fafc" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.5">START: Your backend finished processing the incoming HTTP request</text>
  </g>

  <!-- THREE COLUMNS -->

  <!-- ================= COLUMN 1: SUCCESS ================= -->
  <g transform="translate(40, 180)">
    <!-- Column Header -->
    <rect x="0" y="0" width="300" height="52" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#card-shadow-2)"/>
    <circle cx="24" cy="26" r="9" fill="#10b981"/>
    <text x="20" y="30" fill="#064e3b" font-size="13" font-weight="900">✓</text>
    <text x="42" y="24" fill="#ecfdf5" font-size="14" font-weight="800">1. Did it succeed?</text>
    <text x="42" y="40" fill="#a7f3d0" font-size="11">Operation completed as requested</text>

    <!-- Branch Card Container -->
    <rect x="0" y="62" width="300" height="420" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>

    <!-- Row 1: 201 Created -->
    <g transform="translate(14, 18)">
      <text x="0" y="12" fill="#94a3b8" font-size="11">Created a new database record?</text>
      <rect x="0" y="18" width="68" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="8" y="33" fill="#34d399" font-size="11.5" font-weight="800">201</text>
      <text x="34" y="33" fill="#a7f3d0" font-size="9" font-weight="600">Created</text>
      <text x="76" y="33" fill="#cbd5e1" font-size="11">New resource stored</text>
    </g>

    <!-- Row 2: 200 OK -->
    <g transform="translate(14, 80)">
      <text x="0" y="12" fill="#94a3b8" font-size="11">Standard data response?</text>
      <rect x="0" y="18" width="68" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="8" y="33" fill="#34d399" font-size="11.5" font-weight="800">200</text>
      <text x="34" y="33" fill="#a7f3d0" font-size="9" font-weight="600">OK</text>
      <text x="76" y="33" fill="#cbd5e1" font-size="11">Regular payload returned</text>
    </g>

    <!-- Row 3: 204 No Content -->
    <g transform="translate(14, 142)">
      <text x="0" y="12" fill="#94a3b8" font-size="11">No body to return (e.g. DELETE)?</text>
      <rect x="0" y="18" width="88" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="8" y="33" fill="#34d399" font-size="11.5" font-weight="800">204</text>
      <text x="34" y="33" fill="#a7f3d0" font-size="8.5" font-weight="600">No Content</text>
      <text x="96" y="33" fill="#cbd5e1" font-size="11">Finished, zero body</text>
    </g>

    <!-- Row 4: 304 Not Modified -->
    <g transform="translate(14, 204)">
      <text x="0" y="12" fill="#94a3b8" font-size="11">Cache tag (ETag) matches?</text>
      <rect x="0" y="18" width="96" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="6" y="33" fill="#94a3b8" font-size="11.5" font-weight="800">304</text>
      <text x="34" y="33" fill="#cbd5e1" font-size="8.5" font-weight="600">Not Modified</text>
      <text x="104" y="33" fill="#cbd5e1" font-size="11">Use client cache</text>
    </g>

    <!-- Column Footer Card -->
    <rect x="12" y="316" width="276" height="88" rx="6" fill="#0d1f18" stroke="#059669" stroke-width="1"/>
    <text x="22" y="336" fill="#34d399" font-size="11" font-weight="700">CLIENT ACTION:</text>
    <text x="22" y="354" fill="#e2e8f0" font-size="11.5">Consumes returned data.</text>
    <text x="22" y="372" fill="#e2e8f0" font-size="11.5">Observability marks request healthy.</text>
    <text x="22" y="390" fill="#a7f3d0" font-size="10.5">No automated retries triggered.</text>
  </g>

  <!-- ================= COLUMN 2: CLIENT ERROR ================= -->
  <g transform="translate(370, 180)">
    <!-- Column Header -->
    <rect x="0" y="0" width="300" height="52" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow-2)"/>
    <circle cx="24" cy="26" r="9" fill="#f59e0b"/>
    <text x="21" y="30" fill="#451a03" font-size="13" font-weight="900">!</text>
    <text x="42" y="24" fill="#fffbeb" font-size="14" font-weight="800">2. Did the user mess up?</text>
    <text x="42" y="40" fill="#fde68a" font-size="11">Client Error (4xx) • Fix input</text>

    <!-- Branch Card Container -->
    <rect x="0" y="62" width="300" height="420" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>

    <!-- Row 1: 401 -->
    <g transform="translate(14, 16)">
      <rect x="0" y="2" width="62" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="6" y="16" fill="#fbbf24" font-size="11" font-weight="800">401</text>
      <text x="32" y="16" fill="#fde68a" font-size="8.5" font-weight="600">Unauth</text>
      <text x="70" y="16" fill="#e2e8f0" font-size="11">Who are you? (Please log in)</text>
    </g>

    <!-- Row 2: 403 -->
    <g transform="translate(14, 52)">
      <rect x="0" y="2" width="70" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="6" y="16" fill="#fbbf24" font-size="11" font-weight="800">403</text>
      <text x="32" y="16" fill="#fde68a" font-size="8" font-weight="600">Forbidden</text>
      <text x="78" y="16" fill="#e2e8f0" font-size="11">Logged in, but no permission</text>
    </g>

    <!-- Row 3: 404 -->
    <g transform="translate(14, 88)">
      <rect x="0" y="2" width="70" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="6" y="16" fill="#fbbf24" font-size="11" font-weight="800">404</text>
      <text x="32" y="16" fill="#fde68a" font-size="8" font-weight="600">Not Found</text>
      <text x="78" y="16" fill="#e2e8f0" font-size="11">Resource does not exist</text>
    </g>

    <!-- Row 4: 409 -->
    <g transform="translate(14, 124)">
      <rect x="0" y="2" width="66" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="6" y="16" fill="#fbbf24" font-size="11" font-weight="800">409</text>
      <text x="32" y="16" fill="#fde68a" font-size="8" font-weight="600">Conflict</text>
      <text x="74" y="16" fill="#e2e8f0" font-size="11">Already exists / unique conflict</text>
    </g>

    <!-- Row 5: 422 -->
    <g transform="translate(14, 160)">
      <rect x="0" y="2" width="62" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="6" y="16" fill="#fbbf24" font-size="11" font-weight="800">422</text>
      <text x="32" y="16" fill="#fde68a" font-size="8.5" font-weight="600">Invalid</text>
      <text x="70" y="16" fill="#e2e8f0" font-size="11">Values break validation rules</text>
    </g>

    <!-- Row 6: 429 -->
    <g transform="translate(14, 196)">
      <rect x="0" y="2" width="72" height="20" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="6" y="16" fill="#fbbf24" font-size="11" font-weight="800">429</text>
      <text x="32" y="16" fill="#fde68a" font-size="8" font-weight="600">Rate Limit</text>
      <text x="80" y="16" fill="#e2e8f0" font-size="11">Too many requests. Slow down</text>
    </g>

    <!-- Column Footer Card -->
    <rect x="12" y="316" width="276" height="88" rx="6" fill="#291804" stroke="#d97706" stroke-width="1"/>
    <text x="22" y="336" fill="#fbbf24" font-size="11" font-weight="700">CLIENT ACTION:</text>
    <text x="22" y="354" fill="#e2e8f0" font-size="11.5">Shows input error to end user.</text>
    <text x="22" y="372" fill="#fde68a" font-size="11.5" font-weight="700">NEVER automatically retry 4xx.</text>
    <text x="22" y="390" fill="#94a3b8" font-size="10.5">Retrying bad data fails 100% of the time.</text>
  </g>

  <!-- ================= COLUMN 3: SERVER ERROR ================= -->
  <g transform="translate(700, 180)">
    <!-- Column Header -->
    <rect x="0" y="0" width="300" height="52" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" filter="url(#card-shadow-2)"/>
    <circle cx="24" cy="26" r="9" fill="#f43f5e"/>
    <text x="20" y="30" fill="#4c0519" font-size="13" font-weight="900">✕</text>
    <text x="42" y="24" fill="#fff1f2" font-size="14" font-weight="800">3. Did the server crash?</text>
    <text x="42" y="40" fill="#fecdd3" font-size="11">Server Error (5xx) • Safe to retry</text>

    <!-- Branch Card Container -->
    <rect x="0" y="62" width="300" height="420" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>

    <!-- Row 1: 500 -->
    <g transform="translate(14, 20)">
      <rect x="0" y="2" width="62" height="20" rx="4" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
      <text x="6" y="16" fill="#fda4af" font-size="11" font-weight="800">500</text>
      <text x="32" y="16" fill="#fecdd3" font-size="8.5" font-weight="600">Crash</text>
      <text x="70" y="16" fill="#e2e8f0" font-size="11">Unhandled bug in our code</text>
    </g>

    <!-- Row 2: 502 -->
    <g transform="translate(14, 76)">
      <rect x="0" y="2" width="76" height="20" rx="4" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
      <text x="6" y="16" fill="#fda4af" font-size="11" font-weight="800">502</text>
      <text x="32" y="16" fill="#fecdd3" font-size="8" font-weight="600">Bad Gateway</text>
      <text x="84" y="16" fill="#e2e8f0" font-size="11">Downstream dependency died</text>
    </g>

    <!-- Row 3: 503 -->
    <g transform="translate(14, 132)">
      <rect x="0" y="2" width="76" height="20" rx="4" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
      <text x="6" y="16" fill="#fda4af" font-size="11" font-weight="800">503</text>
      <text x="32" y="16" fill="#fecdd3" font-size="8" font-weight="600">Unavailable</text>
      <text x="84" y="16" fill="#e2e8f0" font-size="11">Overloaded or shutting down</text>
    </g>

    <!-- Row 4: 504 -->
    <g transform="translate(14, 188)">
      <rect x="0" y="2" width="76" height="20" rx="4" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
      <text x="6" y="16" fill="#fda4af" font-size="11" font-weight="800">504</text>
      <text x="32" y="16" fill="#fecdd3" font-size="8" font-weight="600">Timeout</text>
      <text x="84" y="16" fill="#e2e8f0" font-size="11">Downstream took too long</text>
    </g>

    <!-- Column Footer Card -->
    <rect x="12" y="316" width="276" height="88" rx="6" fill="#2c0b14" stroke="#e11d48" stroke-width="1"/>
    <text x="22" y="336" fill="#fda4af" font-size="11" font-weight="700">CLIENT ACTION:</text>
    <text x="22" y="354" fill="#e2e8f0" font-size="11.5">Shows temporary outage note.</text>
    <text x="22" y="372" fill="#fecdd3" font-size="11.5" font-weight="700">SAFE to retry with backoff &amp; jitter.</text>
    <text x="22" y="390" fill="#94a3b8" font-size="10.5">SRE alerts fire and engineers wake up.</text>
  </g>

  <!-- Bottom Golden Rule Bar -->
  <g transform="translate(40, 626)">
    <rect x="0" y="0" width="960" height="46" rx="8" fill="#17192b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="24" y="28" fill="#a5b4fc" font-size="12" font-weight="800">PRODUCTION RULE:</text>
    <text x="160" y="28" fill="#f8fafc" font-size="12.5">Never return 200 OK for an error. The 3-digit status code is what powers monitoring, caches, and automated retries.</text>
  </g>
</svg>
