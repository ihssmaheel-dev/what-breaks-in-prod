<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="red-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1319"/>
      <stop offset="100%" stop-color="#13101b"/>
    </linearGradient>
    <linearGradient id="green-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1f1d"/>
      <stop offset="100%" stop-color="#0c1724"/>
    </linearGradient>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="460" rx="12" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="280" height="22" rx="11" fill="#1e1e38" stroke="#6366f1" stroke-width="1"/>
    <text x="12" y="15" fill="#a5b4fc" font-size="10.5" font-weight="700" letter-spacing="1">WHAT BREAKS IN PROD • 01 FOUNDATIONS</text>
    <text x="0" y="48" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="-0.5">The Blind Monitoring Trap: Why Hiding Errors in 200 OK Kills Systems</text>
    <text x="0" y="68" fill="#94a3b8" font-size="12.5">When servers lie with 200 OK, monitoring tools report perfect health while real customers suffer silent outages.</text>
  </g>

  <!-- LEFT PANEL: THE BROKEN WAY -->
  <g transform="translate(40, 120)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="440" height="300" rx="10" fill="url(#red-card-grad)" stroke="#e11d48" stroke-width="1.5" stroke-opacity="0.6" filter="url(#subtle-shadow)"/>
    
    <!-- Tag -->
    <rect x="18" y="18" width="110" height="22" rx="4" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
    <text x="26" y="33" fill="#fda4af" font-size="11" font-weight="800">✕ THE BROKEN WAY</text>
    <text x="138" y="33" fill="#f43f5e" font-size="12" font-weight="700">res.status(200).json({ error: ... })</text>

    <!-- Request Flow -->
    <g transform="translate(20, 60)">
      <!-- Client Box -->
      <rect x="0" y="0" width="110" height="50" rx="6" fill="#161b22" stroke="#334155" stroke-width="1"/>
      <text x="55" y="24" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Shopper App</text>
      <text x="55" y="38" fill="#ef4444" font-size="10" text-anchor="middle">Bad Credit Card</text>

      <!-- Arrow -->
      <line x1="115" y1="25" x2="165" y2="25" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Server Box -->
      <rect x="170" y="0" width="110" height="50" rx="6" fill="#161b22" stroke="#334155" stroke-width="1"/>
      <text x="225" y="24" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Payment API</text>
      <text x="225" y="38" fill="#94a3b8" font-size="10" text-anchor="middle">Catches error</text>

      <!-- Arrow Back with 200 OK -->
      <path d="M 225 55 L 225 75 L 55 75 L 55 55" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="90" y="66" width="96" height="18" rx="3" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
      <text x="138" y="79" fill="#fda4af" font-size="9.5" font-weight="700" text-anchor="middle">HTTP 200 OK (Lie!)</text>
    </g>

    <!-- Consequences Box -->
    <rect x="18" y="165" width="404" height="115" rx="6" fill="#0d1117" stroke="#334155" stroke-width="1"/>
    <text x="32" y="188" fill="#fda4af" font-size="11.5" font-weight="700">WHAT HAPPENS IN PRODUCTION:</text>
    
    <circle cx="36" cy="210" r="3" fill="#ef4444"/>
    <text x="46" y="214" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700" fill="#f87171">Monitoring dashboard stays green (99.9%):</tspan> alerts never fire.</text>

    <circle cx="36" cy="235" r="3" fill="#ef4444"/>
    <text x="46" y="239" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700" fill="#f87171">CDNs cache the error:</tspan> other users receive "Card declined" page.</text>

    <circle cx="36" cy="260" r="3" fill="#ef4444"/>
    <text x="46" y="264" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700" fill="#f87171">App never retries:</tspan> checkout fails completely with no automatic recovery.</text>
  </g>

  <!-- RIGHT PANEL: THE PRODUCTION WAY -->
  <g transform="translate(520, 120)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="440" height="300" rx="10" fill="url(#green-card-grad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" filter="url(#subtle-shadow)"/>
    
    <!-- Tag -->
    <rect x="18" y="18" width="126" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="33" fill="#6ee7b7" font-size="11" font-weight="800">✓ PRODUCTION SAFE</text>
    <text x="154" y="33" fill="#34d399" font-size="12" font-weight="700">res.status(422).json({ ... })</text>

    <!-- Request Flow -->
    <g transform="translate(20, 60)">
      <!-- Client Box -->
      <rect x="0" y="0" width="110" height="50" rx="6" fill="#161b22" stroke="#334155" stroke-width="1"/>
      <text x="55" y="24" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Shopper App</text>
      <text x="55" y="38" fill="#ef4444" font-size="10" text-anchor="middle">Bad Credit Card</text>

      <!-- Arrow -->
      <line x1="115" y1="25" x2="165" y2="25" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Server Box -->
      <rect x="170" y="0" width="110" height="50" rx="6" fill="#161b22" stroke="#334155" stroke-width="1"/>
      <text x="225" y="24" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Payment API</text>
      <text x="225" y="38" fill="#34d399" font-size="10" text-anchor="middle">Identifies 422 issue</text>

      <!-- Arrow Back with 422 -->
      <path d="M 225 55 L 225 75 L 55 75 L 55 55" fill="none" stroke="#10b981" stroke-width="1.5"/>
      <rect x="90" y="66" width="102" height="18" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="141" y="79" fill="#a7f3d0" font-size="9.5" font-weight="700" text-anchor="middle">HTTP 422 (Truth!)</text>
    </g>

    <!-- Consequences Box -->
    <rect x="18" y="165" width="404" height="115" rx="6" fill="#0d1117" stroke="#334155" stroke-width="1"/>
    <text x="32" y="188" fill="#34d399" font-size="11.5" font-weight="700">WHAT HAPPENS IN PRODUCTION:</text>
    
    <circle cx="36" cy="210" r="3" fill="#10b981"/>
    <text x="46" y="214" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700" fill="#34d399">Accurate metrics:</tspan> gateway logs 4xx client issue, SRE knows true state.</text>

    <circle cx="36" cy="235" r="3" fill="#10b981"/>
    <text x="46" y="239" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700" fill="#34d399">Caches do NOT store 4xx:</tspan> no polluted responses for other customers.</text>

    <circle cx="36" cy="260" r="3" fill="#10b981"/>
    <text x="46" y="264" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700" fill="#34d399">Targeted user feedback:</tspan> app prompts user to fix card without retrying.</text>
  </g>
</svg>
